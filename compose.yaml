services:
  bloca-admin:
    image: ghcr.io/integratech-org/bloca-admin:main
    container_name: bloca-admin
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
  
  bloca-landing:
    image: ghcr.io/integratech-org/bloca-landing:main
    container_name: bloca-landing
    restart: unless-stopped
    ports:
      - "4000:8080"
